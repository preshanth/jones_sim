name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run linting
      run: |
        # Check for basic Python syntax errors
        python -m py_compile jones_sim/*.py
        python -m py_compile tests/test_*.py

    - name: Run core tests with coverage
      run: |
        pytest tests/ \
          -n auto \
          -m "not slow and not end_to_end and not requires_casa" \
          --cov=jones_sim \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --maxfail=5 \
          -v

    - name: Run medium tests (with some MCMC but not end-to-end)
      if: matrix.python-version == '3.11'  # Only run on one version to save time
      run: |
        pytest tests/ \
          -n auto \
          -m "not end_to_end and not requires_casa" \
          --maxfail=3 \
          -v

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage reports as artifacts
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.11'
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black ruff

    - name: Check code formatting with black
      run: |
        black --check --diff jones_sim/ tests/

    - name: Lint with ruff
      run: |
        ruff check jones_sim/ tests/

  package:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

  integration:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run slow tests (but not end-to-end or CASA)
      run: |
        pytest tests/ \
          -m "slow and not end_to_end and not requires_casa" \
          --maxfail=2 \
          -v \
          --tb=short

    - name: Test package installation
      run: |
        pip uninstall jones_sim -y
        pip install .
        python -c "import jones_sim; print(f'jones_sim {jones_sim.__version__} installed successfully')"