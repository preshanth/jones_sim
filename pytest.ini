[tool:pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as requiring external dependencies
    end_to_end: marks tests as comprehensive end-to-end workflows
    requires_casa: marks tests as requiring CASA tools
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
filterwarnings =
    ignore::UserWarning:jones_sim.casa_interface
    ignore::FutureWarning:pymc
    ignore::FutureWarning