[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jones_sim"
version = "0.1.0"
description = "Forward modeling of radio interferometric visibilities using Jones matrix formalism"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "sympy",
    "numpy",
    "scipy",
]

[project.scripts]
jones-sim = "jones_sim.unified_sampler:main"

[project.optional-dependencies]
plotting = [
    "bokeh",
]
mcmc = [
    "pymc",
    "pytensor",
    "arviz",
]
casa = [
    "casatools",
    "casatasks",
]
all = [
    "bokeh",
    "pymc",
    "pytensor",
    "arviz",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "black",
    "ruff",
    "bokeh",
    "pymc",
    "pytensor",
    "arviz",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jones_sim*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line-too-long (let black handle formatting)
    "E741",  # ambiguous-variable-name (I, Q, U, V are Stokes parameters)
]

[tool.ruff.lint.isort]
known-first-party = ["jones_sim"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "end_to_end: marks tests as end-to-end integration tests",
    "requires_casa: marks tests that require CASA tools installation",
    "integration: marks tests as integration tests",
]